# Settings for runs/continuum_study.py --settings-file: the CO temperature prior at 1500, 2000 and 3000 K on the
# known validation set (0.22 item 7).  With the 3000 K bound the published CO (1400 K, log N 18.5) came out hot and
# thin (2394 K, log N 15) in 0.20; the three runs show which bound keeps T and N meaningful and whether N.A is
# stable (it should be: the same lines, the same flux).  Everything else is the manifest's default.
#   python continuum_study.py run validation_known.yaml --settings-file co_bound_settings.yaml --only FZ_Tau_P24,DR_Tau,CX_Tau,GW_Lup,Sz_114,DF_Tau --root results/co_bound
CO_T1500: {fit: {bounds_by_molecule: {CO: {T: [100.0, 1500.0]}, 13CO: {T: [100.0, 1500.0]}}}}
CO_T2000: {fit: {bounds_by_molecule: {CO: {T: [100.0, 2000.0]}, 13CO: {T: [100.0, 2000.0]}}}}
CO_T3000: {fit: {bounds_by_molecule: {CO: {T: [100.0, 3000.0]}, 13CO: {T: [100.0, 3000.0]}}}}
