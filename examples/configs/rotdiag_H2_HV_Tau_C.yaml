# H2 rotation diagram of HV Tau C from the s3d cubes (bundled cutouts: 5 lines; point it at the full cube folder for
# S(1)-S(8) + v=1-1): 1" circle around the source, two temperatures + power law, A_V and OPR free.
# jalebi rotdiag run rotdiag_H2_HV_Tau_C.yaml
molecule: H2
target: HV_Tau_C
spectrum:
  path: example:HV_Tau_C_cube
  source: s3d
  rv_kms: 0.0
  region: circle
  dx: 0.0
  dy: 0.0
  radius_arcsec: 1.0
  params: []
  aperture_fwhm_scale: 1.5
lines:
  max_features: 60
  blend_fwhm: 0.5
  member_rel: 0.01
  edge_fwhm: 3.0
  include: []
  exclude: []
  resolving_power: argyriou2023
measure:
  method: gauss
  velocity: auto
  width: auto
  window_fwhm: 8.0
  joint_fwhm: 2.0
  core_fwhm: 1.2
  cont_order: 1
  continuum: local
  snr_detect: 3.0
  integrate_fwhm: 1.2
  contaminants: true
  flux_unit: Jy
  skip: []
geometry:
  mode: aperture
  R_au: 1.0
  aperture_arcsec: 0.5
fit:
  model: two
  opr: species
  opr_value: 3.0
  opr_free: true
  av: 0.0
  av_free: true
  extinction: KP5
  opacity: false
  fwhm_kms: 10.0
  fwhm_free: false
  R_free: false
  sys_frac: 0.1
  use: all
  tmax_powerlaw: 4000.0
  bounds: {}
  fixed: {}
  start: {}
  compare: true
  also:
  - powerlaw
mcmc:
  enabled: true
  walkers: 48
  steps: 3000
  burn: 1000
  thin: 1
  seed: 42
output: results/{target}/rotdiag/{molecule}
plots: true
