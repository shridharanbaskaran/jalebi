# JALEBI example: CI Tau fitted the way the published two-temperature water fits were made --
# only narrow regions around the 56 isolated pure-rotational lines of Banzatti+2025 (MIRI_H2O_v0-0),
# 12-27 µm, regions beyond 20 µm weighted x5 (Temmink+2025).  Recovers T_hot ~ 830 K / T_cold ~ 390 K
# (Banzatti+2023: 840 K; Romero-Mirza+2024: 903 / 477 K) where the every-pixel fit gives 1280 / 600 K.
target:
  name: CI Tau
  path: /home/dugong/Desktop/Work/YSOs_MIRI_reduced_cube_data_Aug2026/disk_only/V-CI-TAU_jw01640-o005_t005_miri
  distance_pc: 160
  rv_kms: 17.7
  extraction: {source: s3d, ra: 68.466791, dec: 22.8416009, aperture_fwhm_scale: 1.5, apcorr: mrs}
continuum: {method: irsqr, quantile: 0.1, knot_spacing: 25}
linedata:
  releases: {H2O: hitemp}
components:
  - {name: H2O_hot,  molecule: H2O, logN: 18.3, T: 900, logR: -0.6}
  - {name: H2O_cold, molecule: H2O, logN: 18.3, T: 450, logR:  0.0}
fit:
  windows: [[12.0, 27.0]]              # only limits the range: the pixels come from line_regions
  line_regions: [H2O_v0-0]
  region_pad_um: 0.0
  region_weight_beyond: [20.0, 5.0]
  ordering: [[H2O_hot, H2O_cold]]
  stages: [grid, optimise, mcmc]
  grid: {logN: [16, 20, 17], T: [150, 1200, 22]}
  optimise: {method: de, maxiter: 120, popsize: 10, workers: 4}
  mcmc: {nsteps: 4000, processes: 4}
output: results/{target}/lines_B23
