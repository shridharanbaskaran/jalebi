# H2O: the isolated lines of Banzatti et al. (2025) in FZ Tau, integrated over their windows, with the optical depth
# of a slab of R = 0.5 au.  jalebi rotdiag run rotdiag_H2O_FZ_Tau.yaml
molecule: H2O
spectrum:
  path: example:FZ_Tau
  source: auto
  rv_kms: 0.0
  aperture_fwhm_scale: 1.5
lines:
  rel_min: 0.001
  max_features: 60
  blend_fwhm: 0.5
  member_rel: 0.01
  edge_fwhm: 3.0
  include: []
  exclude: []
  resolving_power: argyriou2023
measure:
  method: integrate
  velocity: auto
  width: auto
  window_fwhm: 8.0
  joint_fwhm: 2.0
  core_fwhm: 1.2
  cont_order: 1
  continuum: local
  snr_detect: 3.0
  integrate_fwhm: 1.2
  contaminants: true
  flux_unit: Jy
  skip: []
geometry:
  mode: radius
  R_au: 0.5
  aperture_arcsec: 0.5
fit:
  model: single
  opr: thermal
  opr_value: 3.0
  opr_free: true
  av: 0.0
  av_free: false
  extinction: KP5
  opacity: true
  fwhm_kms: 4.7
  fwhm_free: false
  R_free: false
  sys_frac: 0.1
  use: all
  tmax_powerlaw: 4000.0
  bounds: {}
  fixed: {}
  start: {}
  compare: false
mcmc:
  enabled: true
  walkers: 48
  steps: 3000
  burn: 1000
  thin: 1
  seed: 42
output: results/{target}/rotdiag/{molecule}
plots: true
